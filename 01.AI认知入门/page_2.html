<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>目录</title>
<script src="https://qn.cache.wpscdn.cn/copilot-test/copilot-cdn/js/tailwindcss@3.4.17.js"></script>
<link href="https://qn.cache.wpscdn.cn/copilot-test/copilot-cdn/css/fontawesome-free@6.4.0.css" rel="stylesheet" />
<style>
* { margin:0; padding:0; list-style:none; text-decoration:none; box-sizing:border-box; }
.slide-container { width:1280px; height:720px; background:#0B1120; position:relative; font-family:"Microsoft YaHei",sans-serif; overflow:hidden; }
.slide-container h1 { font-size:48px !important; color:#E0E7FF; font-weight:700; }
.slide-toc-item { display:flex; align-items:flex-start; padding:10px 0; border-bottom:1px solid rgba(0,229,255,0.1); }
.slide-toc-num { font-size:28px; font-weight:700; color:#00E5FF; min-width:60px; line-height:1; }
.slide-toc-text { flex:1; }
.slide-toc-title { font-size:18px; color:#E0E7FF; font-weight:600; margin-bottom:2px; }
.slide-toc-desc { font-size:13px; color:rgba(224,231,255,0.5); }
.slide-accent-line { width:50px; height:3px; background:#FF6B35; }
</style>
</head>
<body>
<div class="slide-container flex">
  <div class="flex flex-col justify-center" style="width:360px; padding-left:80px;">
    <h1 class="mb-6">目录</h1>
    <div class="slide-accent-line mb-6"></div>
    <p style="font-size:15px; color:rgba(224,231,255,0.4); line-height:1.8;">
      从AI诞生到编程革命<br>一条80年的技术进化之路
    </p>
  </div>
  <div class="flex flex-col justify-center flex-1" style="padding:30px 80px 30px 40px;">
    <div class="slide-toc-item">
      <div class="slide-toc-num">01</div>
      <div class="slide-toc-text"><div class="slide-toc-title">AI的探索：80年的曲折</div><div class="slide-toc-desc">符号主义、专家系统、搜索与推荐、深度学习（第3-7页）</div></div>
    </div>
    <div class="slide-toc-item">
      <div class="slide-toc-num">02</div>
      <div class="slide-toc-text"><div class="slide-toc-title">Transformer与统一建模</div><div class="slide-toc-desc">注意力机制、并行计算、原生多模态（第8-9页）</div></div>
    </div>
    <div class="slide-toc-item">
      <div class="slide-toc-num">03</div>
      <div class="slide-toc-text"><div class="slide-toc-title">大模型为什么成功</div><div class="slide-toc-desc">GPT进化、三大要素、Scaling Laws、为什么这次不一样（第10-15页）</div></div>
    </div>
    <div class="slide-toc-item">
      <div class="slide-toc-num">04</div>
      <div class="slide-toc-text"><div class="slide-toc-title">AI编程革命</div><div class="slide-toc-desc">从补全到Agent、工具全景（第16-18页）</div></div>
    </div>
    <div class="slide-toc-item" style="border-bottom:none;">
      <div class="slide-toc-num">05</div>
      <div class="slide-toc-text"><div class="slide-toc-title">概念辨析与总结</div><div class="slide-toc-desc">核心概念、训练过程、硬件基础（第19-27页）</div></div>
    </div>
  </div>
</div>
