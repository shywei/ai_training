<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>总结</title>
<script src="https://qn.cache.wpscdn.cn/copilot-test/copilot-cdn/js/tailwindcss@3.4.17.js"></script>
<link href="https://qn.cache.wpscdn.cn/copilot-test/copilot-cdn/css/fontawesome-free@6.4.0.css" rel="stylesheet" />
<style>
* { margin:0; padding:0; list-style:none; text-decoration:none; box-sizing:border-box; }
.slide-container { width:1280px; height:720px; background:#0B1120; position:relative; font-family:"Microsoft YaHei",sans-serif; overflow:hidden; }
.slide-glow { position:absolute; width:500px; height:500px; border-radius:50%; background:radial-gradient(circle, rgba(0,229,255,0.06) 0%, transparent 70%); }
.slide-main-title { font-size:38px; font-weight:700; color:#E0E7FF; text-align:center; line-height:1.4; }
.slide-sub-title { font-size:18px; color:rgba(224,231,255,0.5); text-align:center; line-height:1.6; margin-top:16px; }
.slide-keywords { display:flex; justify-content:center; gap:30px; margin-top:40px; }
.slide-keyword { text-align:center; width:240px; padding:20px; background:rgba(0,229,255,0.03); border:1px solid rgba(0,229,255,0.1); }
.slide-keyword-icon { font-size:28px; margin-bottom:10px; }
.slide-keyword-title { font-size:16px; font-weight:700; color:#E0E7FF; margin-bottom:4px; }
.slide-keyword-desc { font-size:12px; color:rgba(224,231,255,0.45); line-height:1.5; }
</style>
</head>
<body>
<div class="slide-container flex flex-col items-center justify-center">
  <div class="slide-glow" style="top:-150px; right:-100px;"></div>
  <div class="slide-glow" style="bottom:-200px; left:100px; width:400px; height:400px;"></div>
  <div style="padding:0 120px;">
    <div class="slide-main-title">
      从写代码到设计意图<br>从单兵作战到人机协作
    </div>
    <div class="slide-sub-title">
      AI辅助编程不是未来，是现在。今天的培训是起点，不是终点。
    </div>
    <div class="slide-keywords">
      <div class="slide-keyword">
        <div class="slide-keyword-icon" style="color:#00E5FF;"><i class="fas fa-terminal"></i></div>
        <div class="slide-keyword-title">今天回去就试</div>
        <div class="slide-keyword-desc">装一个Copilot或OpenCode<br>在真实项目里用一次</div>
      </div>
      <div class="slide-keyword">
        <div class="slide-keyword-icon" style="color:#FF6B35;"><i class="fas fa-comments"></i></div>
        <div class="slide-keyword-title">学会跟AI对话</div>
        <div class="slide-keyword-desc">写好提示词<br>是AI时代的核心技能</div>
      </div>
      <div class="slide-keyword">
        <div class="slide-keyword-icon" style="color:#E0E7FF;"><i class="fas fa-shield-alt"></i></div>
        <div class="slide-keyword-title">保持审查意识</div>
        <div class="slide-keyword-desc">AI是超级工具<br>你的判断力是最后防线</div>
      </div>
    </div>
  </div>
</div>

</html>
