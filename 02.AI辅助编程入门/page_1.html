<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>封面</title>
<script src="https://qn.cache.wpscdn.cn/copilot-test/copilot-cdn/js/tailwindcss@3.4.17.js"></script>
<link href="https://qn.cache.wpscdn.cn/copilot-test/copilot-cdn/css/fontawesome-free@6.4.0.css" rel="stylesheet" />
<style>
* { margin:0; padding:0; list-style:none; text-decoration:none; box-sizing:border-box; }
.slide-container { width:1280px; height:720px; background:#0B1120; position:relative; font-family:"Microsoft YaHei",sans-serif; overflow:hidden; }
.slide-glow { position:absolute; width:400px; height:400px; border-radius:50%; background:radial-gradient(circle, rgba(0,229,255,0.08) 0%, transparent 70%); }
.slide-timeline-line { position:absolute; left:120px; top:80px; bottom:80px; width:3px; background:linear-gradient(to bottom, transparent, #00E5FF, transparent); }
.slide-timeline-dot { position:absolute; left:112px; width:20px; height:20px; border-radius:50%; border:2px solid #00E5FF; background:#0B1120; }
.slide-timeline-dot::after { content:''; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:8px; height:8px; border-radius:50%; background:#00E5FF; }
.slide-container h1 { font-size:64px !important; color:#E0E7FF; font-weight:700; line-height:1.2; }
.slide-container h2 { font-size:28px !important; color:#00E5FF; font-weight:400; letter-spacing:4px; }
.slide-container p.slide-date { font-size:20px !important; color:rgba(224,231,255,0.5); }
</style>
</head>
<body>
<div class="slide-container flex items-center">
  <div class="slide-glow" style="top:-100px; right:-100px;"></div>
  <div class="slide-glow" style="bottom:-150px; left:200px; width:300px; height:300px;"></div>
  <div class="slide-timeline-line"></div>
  <div class="slide-timeline-dot" style="top:120px;"></div>
  <div class="slide-timeline-dot" style="top:240px;"></div>
  <div class="slide-timeline-dot" style="top:360px;"></div>
  <div class="slide-timeline-dot" style="top:480px;"></div>
  <div class="slide-timeline-dot" style="top:580px;"></div>
  <div class="ml-48 flex flex-col justify-center" style="padding-top:40px;">
    <div class="mb-4">
      <span style="color:#00E5FF; font-size:16px; letter-spacing:8px; text-transform:uppercase;">AI-ASSISTED PROGRAMMING</span>
    </div>
    <h1 class="mb-6">AI辅助编程</h1>
    <h2 class="mb-10">从提示词到Agent编程</h2>
    <div style="width:80px; height:3px; background:#FF6B35;" class="mb-8"></div>
    <p class="slide-date">2026</p>
    <p style="font-size:14px; color:rgba(224,231,255,0.3); margin-top:12px; letter-spacing:1px;">Prompt决定回答质量，Context决定任务复杂度</p>
  </div>
  <div class="absolute right-16 top-1/2 transform -translate-y-1/2" style="opacity:0.15;">
    <i class="fas fa-terminal" style="font-size:200px; color:#00E5FF;"></i>
  </div>
</div>
</body>
</html>
