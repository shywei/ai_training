<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=1280">
<title>为什么需要Agent</title>
<script src="https://qn.cache.wpscdn.cn/copilot-test/copilot-cdn/js/tailwindcss@3.4.17.js"></script>
<link href="https://qn.cache.wpscdn.cn/copilot-test/copilot-cdn/css/fontawesome-free@6.4.0.css" rel="stylesheet"/>
<style>
*{margin:0;padding:0;list-style:none;text-decoration:none;box-sizing:border-box}
.s{width:1280px;height:720px;background:#0B1120;position:relative;font-family:"Microsoft YaHei",sans-serif;overflow:hidden}
.s h1{font-size:32px!important;color:#E0E7FF;font-weight:700}
.sn{font-size:14px;color:#00E5FF;letter-spacing:4px}
.q{font-size:18px;color:#FF6B35;font-weight:700;padding:10px 16px;background:rgba(255,107,53,0.06);border-left:4px solid #FF6B35;margin-bottom:14px;line-height:1.4}
.cb{padding:12px 14px;border:1px solid rgba(0,229,255,0.12);background:rgba(0,229,255,0.03);margin-bottom:8px}
.ct{font-size:14px;font-weight:700;color:#00E5FF;margin-bottom:3px}
.cd{font-size:13px;color:rgba(224,231,255,0.55);line-height:1.6}
</style></head><body>
<div class="s" style="padding:36px 60px;">
<div class="mb-2 sn">CHAPTER 01</div><h1 class="mb-2">为什么需要Agent</h1><div style="width:50px;height:3px;background:#FF6B35;margin-bottom:24px;"></div>

<div style="margin-bottom:14px;">
  <div class="q">ChatGPT已经这么强了，为什么还需要Agent？</div>
</div>
<div class="flex" style="gap:28px;">
  <div style="flex:1;">
    <div style="font-size:14px;color:#00E5FF;font-weight:700;margin-bottom:10px;">✅ ChatGPT能做的</div>
    <div class="cb"><div class="cd">回答问题、生成内容、理解上下文、代码生成</div></div>
    <div style="font-size:12px;color:rgba(224,231,255,0.4);margin-top:6px;text-align:center;">一问一答，对话结束即终止</div>
  </div>
  <div style="width:2px;background:rgba(0,229,255,0.15);"></div>
  <div style="flex:1;">
    <div style="font-size:14px;color:#FF6B35;font-weight:700;margin-bottom:10px;">❌ ChatGPT做不到的</div>
    <div class="cb"><div class="cd">不能调用企业系统（ERP、CRM）</div></div>
    <div class="cb"><div class="cd">不能长期记忆（每次对话从零开始）</div></div>
    <div class="cb"><div class="cd">不能规划复杂任务（多步骤自动执行）</div></div>
    <div class="cb"><div class="cd">不能主动行动（只能被动回答）</div></div>
  </div>
</div>
<div style="margin-top:14px;padding:12px 16px;background:rgba(0,229,255,0.04);border:1px solid rgba(0,229,255,0.12);text-align:center;">
  <div style="font-size:14px;color:#E0E7FF;">企业需要的不是"聊天机器人"，而是能<span style="color:#00E5FF;font-weight:700;">连接系统、调用工具、记住上下文、自主执行</span>的"智能系统"</div>
</div>
<div style="margin-top:10px;text-align:center;font-size:13px;color:rgba(224,231,255,0.5);">Agent不是模型，Agent是系统。LLM是大脑，Agent还有手、脚和记忆。</div>
</div></body></html>
