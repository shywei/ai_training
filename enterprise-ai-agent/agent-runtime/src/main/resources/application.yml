server:
  port: 8080

# SSE 长任务保护：工作流先同步执行（多轮 LLM 调用），首包 token 前静默期长。
# 不配置此项时 Spring MVC 异步请求默认约 30 秒超时，
# 连接会在第一个 token 前被容器掐断，前端显示"（无响应）"。
spring.mvc.async.request-timeout: 600000

# ============================================================
# 硅基流动(SiliconFlow)免费模型
# 快模型: tencent/Hunyuan-MT-7B(免费)
# 推理模型: deepseek-ai/DeepSeek-R1-0528-Qwen3-8B(免费,有思维链)
# ============================================================

spring:
  ai:
    openai:
      api-key: ${SILICONFLOW_API_KEY:***
      base-url: https://api.siliconflow.cn
      chat:
        options:
          model: Qwen/Qwen2.5-7B-Instruct
          temperature: 0.7

# ============================================================
# Redis(Session Memory)
# ============================================================

spring.data.redis.host: ${REDIS_HOST:localhost}
spring.data.redis.port: ${REDIS_PORT:6379}
spring.data.redis.timeout: 5000

# ============================================================
# MySQL(用户画像持久化)
# ============================================================

spring.datasource.url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/agent_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username: ${MYSQL_USER:root}
spring.datasource.password: ${MYSQL_PASS:root}
spring.datasource.driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus.configuration.map-underscore-to-camel-case: true
mybatis-plus.configuration.log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ============================================================
# MCP Server 连接配置
# ============================================================

mcp:
  product:
    server-url: ${MCP_SERVER_URL:http://localhost:8081}
  knowledge:
    server-url: ${KNOWLEDGE_SERVER_URL:http://localhost:8082}

# ============================================================
# 导购 Agent 配置
# ============================================================

agent:
  name: 导购助手
  role: 你是一个专业的电商导购助手,帮助用户推荐合适的商品。
  constraints: 推荐商品必须基于商品库知识，不编造商品信息。不确定的信息说“我不确定”。话题偏离购物时，友好提醒用户回到正题，但不要生硬拒绝。
  model:
    # 日常对话模型（导购回复）
    chat: Qwen/Qwen2.5-7B-Instruct
    # 路由分类模型（意图识别，要求快+便宜）
    routing: Qwen/Qwen2.5-7B-Instruct
    # 复杂推理模型（多步分析、对比推荐）
    reasoning: Qwen/Qwen3-8B
    # 结构化输出模型（画像抽取，要求 JSON 格式稳定）
    extract: Qwen/Qwen3-8B
    # 记忆提取模型（对话摘要，要求快+便宜）
    memory: Qwen/Qwen2.5-7B-Instruct
