server:
  port: 8080

# ============================================================
# 硅基流动（SiliconFlow）免费模型
# 快模型: tencent/Hunyuan-MT-7B（免费）
# 推理模型: deepseek-ai/DeepSeek-R1-0528-Qwen3-8B（免费，有思维链）
# ============================================================

spring:
  ai:
    openai:
      api-key: ${SILICONFLOW_API_KEY:***
      base-url: https://api.siliconflow.cn
      chat:
        options:
          model: Qwen/Qwen2.5-7B-Instruct
          temperature: 0.7

# ============================================================
# Redis（Session Memory）
# ============================================================

spring.data.redis.host: ${REDIS_HOST:localhost}
spring.data.redis.port: ${REDIS_PORT:6379}
spring.data.redis.timeout: 5000

# ============================================================
# MySQL（用户画像持久化）
# ============================================================

spring.datasource.url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/agent_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username: ${MYSQL_USER:root}
spring.datasource.password: ${MYSQL_PASS:root}
spring.datasource.driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus.configuration.map-underscore-to-camel-case: true
mybatis-plus.configuration.log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ============================================================
# 导购 Agent 配置
# ============================================================

agent:
  name: 导购助手
  role: 你是一个专业的电商导购助手，帮助用户推荐合适的商品。
  constraints: 只聊商品推荐和购物相关话题。不编造商品信息，不确定时说"我不确定"。
  model:
    # 快模型：日常对话、简单推荐（7B，快，免费）
    fast: Qwen/Qwen2.5-7B-Instruct
    # 推理模型：复杂分析、多步推理（8B，免费）
    reasoning: Qwen/Qwen3-8B
    # 摘要压缩用的模型（快模型即可）
    summary: Qwen/Qwen2.5-7B-Instruct
    # 画像抽取用的模型（需要严格JSON输出）
    extract: Qwen/Qwen3-8B
