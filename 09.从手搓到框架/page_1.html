<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=1280">
<title>封面</title>
<script src="https://qn.cache.wpscdn.cn/copilot-test/copilot-cdn/js/tailwindcss@3.4.17.js"></script>
<link href="https://qn.cache.wpscdn.cn/copilot-test/copilot-cdn/css/fontawesome-free@6.4.0.css" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
.s{width:1280px;height:720px;background:#0B1120;color:#E0E7FF;position:relative;font-family:"Microsoft YaHei",sans-serif;overflow:hidden}
.glow{position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(0,229,255,0.08) 0%,transparent 70%)}
.tl{position:absolute;left:120px;top:80px;bottom:80px;width:3px;background:linear-gradient(to bottom,transparent,#00E5FF,transparent)}
.td{position:absolute;left:112px;width:20px;height:20px;border-radius:50%;border:2px solid #00E5FF;background:#0B1120}
.td::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:8px;height:8px;border-radius:50%;background:#00E5FF}
</style></head><body>
<div class="s" style="display:flex;align-items:center;">
  <div class="glow" style="top:-100px;right:-100px;"></div>
  <div class="glow" style="bottom:-150px;left:200px;width:300px;height:300px;"></div>
  <div class="tl"></div>
  <div class="td" style="top:120px;"></div><div class="td" style="top:240px;"></div>
  <div class="td" style="top:360px;"></div><div class="td" style="top:480px;"></div>
  <div class="td" style="top:580px;"></div>
  <div style="margin-left:180px;max-width:960px;">
    <div style="margin-bottom:12px;"><span style="color:#00E5FF;font-size:16px;letter-spacing:8px;">FRAMEWORK BOUNDARIES &amp; SELECTION</span></div>
    <h1 style="font-size:60px;color:#E0E7FF;font-weight:700;line-height:1.2;margin-bottom:16px;">从手搓到框架：框架的边界</h1>
    <h2 style="font-size:23px;color:#00E5FF;font-weight:400;letter-spacing:2px;margin-bottom:32px;">同构重构提效（V5 → V6 → V7） · 企业级运行时补齐 · 领域边界与防套牢</h2>
    <div style="width:80px;height:3px;background:#FF6B35;margin-bottom:24px;"></div>
    <p style="font-size:18px;color:rgba(224,231,255,0.75);">2026</p>
    <p style="font-size:14px;color:rgba(224,231,255,0.7);margin-top:12px;letter-spacing:1px;">Spring AI 2.0.2 GA · AgentScope Java 2.0.0 GA · Checkpointer · Middleware · 六边形架构</p>
  </div>
  <div style="position:absolute;right:80px;top:50%;transform:translateY(-50%);opacity:0.12;">
    <i style="font-size:200px;color:#00E5FF;" class="fas fa-layer-group"></i>
  </div>
</div>
</body></html>
