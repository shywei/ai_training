<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=1280">
<title>大模型的失忆症</title>
<style>*{margin:0;padding:0;box-sizing:border-box}
.s{width:1280px;height:720px;background:#0B1120;position:relative;font-family:"Microsoft YaHei",sans-serif;overflow:hidden}
.s h1{font-size:32px!important;color:#E0E7FF;font-weight:700}
.sn{font-size:14px;color:#00E5FF;letter-spacing:4px}
pre{margin:0;font-family:Consolas,Monaco,monospace;font-size:11px;line-height:1.5;color:rgba(224,231,255,0.7)}
.kw{color:#FF6B35} .str{color:#00E5FF} .cm{color:rgba(224,231,255,0.3)}</style></head><body>
<div class="s" style="padding:30px 60px;display:flex;flex-direction:column;position:relative;">
<div class="sn">CHAPTER 01</div>
<h1 class="mb-2">大模型的失忆症</h1>
<div style="width:50px;height:3px;background:#FF6B35;margin-bottom:16px;"></div>

<div style="flex:1;display:flex;flex-direction:column;justify-content:center;">
  <div style="display:flex;gap:20px;margin-bottom:18px;">
    <div style="flex:1;padding:16px;background:rgba(255,107,53,0.06);border:2px solid rgba(255,107,53,0.2);border-radius:8px;">
      <div style="font-size:15px;color:#FF6B35;font-weight:700;margin-bottom:8px;">每次调用都是独立的</div>
      <div style="font-size:12px;color:rgba(224,231,255,0.55);line-height:1.7;">LLM API 没有记忆。每次请求都是全新的 HTTP POST。<br>你说"我叫张三"→模型回应→下一次请求→模型不知道张三是谁。<br><strong style="color:#E0E7FF;">模型不保留任何上一次的状态。</strong></div>
    </div>
    <div style="flex:1;padding:16px;background:rgba(0,229,255,0.04);border:1px solid rgba(0,229,255,0.12);border-radius:8px;">
      <div style="font-size:15px;color:#00E5FF;font-weight:700;margin-bottom:8px;">为什么不能靠模型自己记？</div>
      <div style="font-size:12px;color:rgba(224,231,255,0.55);line-height:1.7;"><strong style="color:#FF6B35;">Context Window 有限</strong>——塞不下所有历史<br><strong style="color:#FF6B35;">Token 成本</strong>——历史越长每次调用越贵<br><strong style="color:#FF6B35;">跨 Session 不生效</strong>——换浏览器就失忆<br><strong style="color:#E0E7FF;">Memory 必须在服务端实现。</strong></div>
    </div>
  </div>
  <div style="padding:12px 16px;background:rgba(0,229,255,0.04);border:1px solid rgba(0,229,255,0.1);border-radius:6px;">
    <div style="font-size:13px;color:#E0E7FF;text-align:center;"><strong style="color:#FF6B35;">核心矛盾：</strong>模型是无状态的，但业务需要有状态的对话。<strong style="color:#00E5FF;">这个矛盾必须由服务端代码来解决。</strong></div>
  </div>
</div>
<div style="position:absolute;bottom:14px;right:60px;padding:4px 12px;background:rgba(0,229,255,0.08);border:1px solid rgba(0,229,255,0.2);border-radius:12px;font-size:10px;color:#00E5FF;">Demo 可验证</div>
</div></body></html>
